title: Indian Stock Market — 6-Week Beginner Roadmap
description: A structured, education-only 6-week roadmap to learn the Indian stock market, investing and trading from scratch.
lang: en-IN

# ---------------------------------------------------------------------------
# IMPORTANT: set these two for your repository before the first deploy.
#
#   Project site  https://<user>.github.io/<repo>/
#     url:     "https://<user>.github.io"
#     baseurl: "/<repo>"          <- must start with "/", no trailing slash
#
#   User/org site https://<user>.github.io/   (repo named <user>.github.io)
#     url:     "https://<user>.github.io"
#     baseurl: ""
#
# A wrong baseurl is the #1 cause of "the site loads but has no CSS".
# ---------------------------------------------------------------------------
url: "https://kumudgupta76.github.io"
baseurl: "/basic-finance"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links   # makes [x](file.md) links work on the built site
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

# just-the-docs options
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/

heading_anchors: true
color_scheme: light

aux_links:
  "View on GitHub":
    - "https://github.com/kumudgupta76/basic-finance"

footer_content: >-
  Educational content only. Not investment advice, not a recommendation to buy or sell any
  security, and no promise of returns. Verify all rules with SEBI, NSE, BSE, AMFI and RBI.

back_to_top: true
back_to_top_text: "Back to top"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - initial-plan.md
